#power
CONFIG_ZMK_EXT_POWER=n
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_SLEEP=n
#CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
#CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_KEYBOARD_NAME="Lily58"
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# oled
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# nice_oled - central (left): battery, BT profile/connection, WPM graph, layer
# Bump LVGL's dynamic-object memory pool (module default 8192) -- with
# battery + output + layer + WPM number + graph all active at once,
# too small a pool causes exactly the kind of corrupted/garbled glyph
# rendering seen on the WPM number (a live, frequently-updating label).
CONFIG_LV_Z_MEM_POOL_SIZE=16384
CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH=y
CONFIG_NICE_OLED_WIDGET_WPM_NUMBER=y
CONFIG_NICE_OLED_WIDGET_WPM_SPEEDOMETER=n
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=n
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n
# BT profile dots moved to the very top of the screen. The module has
# no documented toggle to disable just the profile *number* (only
# position controls exist), so it's hidden by pushing it far off the
# visible canvas rather than truly turned off -- a workaround, not a
# clean disable.
CONFIG_NICE_OLED_WIDGET_PROFILE_CUSTOM_X=0
CONFIG_NICE_OLED_WIDGET_PROFILE_CUSTOM_Y=2
CONFIG_NICE_OLED_WIDGET_PROFILE_TEXT_CUSTOM_X=25
CONFIG_NICE_OLED_WIDGET_PROFILE_TEXT_CUSTOM_Y=999
# Everything else shifted down ~14px to make room for the dots now
# occupying the top of the screen. Vertical order top-to-bottom:
# BT dots (Y=2) -> output icon (Y=46) -> battery (Y=64) ->
# layer (Y=76) -> WPM number (Y=94) -> WPM graph (Y=100)
CONFIG_NICE_OLED_WIDGET_OUTPUT_USB_CUSTOM_X=0
CONFIG_NICE_OLED_WIDGET_OUTPUT_USB_CUSTOM_Y=46
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_CUSTOM_X=4
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_CUSTOM_Y=46
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_UNBONDED_CUSTOM_X=-1
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_UNBONDED_CUSTOM_Y=46
CONFIG_NICE_OLED_WIDGET_BATTERY_CUSTOM_X=0
CONFIG_NICE_OLED_WIDGET_BATTERY_CUSTOM_Y=64
CONFIG_NICE_OLED_WIDGET_LAYER=y
CONFIG_NICE_OLED_WIDGET_LAYER_CUSTOM_X=0
CONFIG_NICE_OLED_WIDGET_LAYER_CUSTOM_Y=76
# WPM number's font is smaller than battery/layer's, so its Y sits
# closer to the graph than a naive 12px would suggest -- a shorter
# label leaves more blank space per pixel of raw Y delta, so a
# smaller delta here should read as the same visual gap as the 12px
# used between battery and layer.
# X centers the number horizontally: its anchor point is the center
# of the text itself (unlike battery/layer, which anchor at their
# left edge), so X=16 (half of the 32px-wide strip) centers it exactly
CONFIG_NICE_OLED_WIDGET_WPM_LABEL_CUSTOM_X=16
CONFIG_NICE_OLED_WIDGET_WPM_LABEL_CUSTOM_Y=94
CONFIG_NICE_OLED_WIDGET_WPM_GAUGE_CUSTOM_X=0
CONFIG_NICE_OLED_WIDGET_WPM_GAUGE_CUSTOM_Y=100
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=n
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=n

# nice_oled - peripheral (right): battery, connection, gem animation
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_GEM=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SMART_BATTERY=y


#encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# usb display wake
CONFIG_USB_DISPLAY_WAKE=y

# rgb underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=10
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0